[project]
name = "loan-prediction-system-with-advisory-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dotenv>=0.9.9",
    "fpdf2>=2.8.7",
    "loguru>=0.7.3",
    "numpy==1.26.4",
    "pandas>=2.3.3",
    "pillow>=12.2.0",
    "plotly>=6.8.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "streamlit>=1.58.0",
    "xgboost>=3.2.0",
    # Vector stores and embeddings
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    # HuggingFace inference
    "huggingface-hub>=0.24.0",
    # transformers 5.x requires torch>=2.4 which has no macOS Intel (x86_64) wheels;
    # pin to 4.x which works with torch 2.2.x
    "transformers>=4.40.0,<5.0.0",
    # torch 2.5+ dropped macOS Intel wheels; pin to the last compatible series
    "torch>=2.0.0,<2.5.0",
    # Visualisation for benchmark script
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    # Document loading (PDF, DOCX)
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    # NLP utilities
    "nltk>=3.8.0",
    # Database
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    # Backend API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "requests>=2.32.0",
    # Per-applicant local feature attribution (LIME replaces SHAP — no numba/llvmlite)
    "lime>=0.2.0.1",
]
